[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "google-docs-mcp"
version = "0.1.0"
description = "Small, revision-safe Google Docs MCP for Hermes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp[cli]==1.29.1",
  "google-auth>=2.55,<3",
  "requests>=2.33,<3",
  "defusedxml>=0.7,<1",
  "pydantic>=2.12,<3",
]

[project.urls]
Repository = "https://github.com/mohamadsmt/google-docs-mcp"
Issues = "https://github.com/mohamadsmt/google-docs-mcp/issues"

[project.scripts]
google-docs-mcp = "google_docs_mcp.server:main"

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "pytest>=8.4,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/google_docs_mcp"]
only-include = [
  "src/google_docs_mcp/read_metadata.py",
  "src/google_docs_mcp/exports.py",
  "src/google_docs_mcp/images.py",
  "src/google_docs_mcp/editing_common.py",
  "src/google_docs_mcp/sections.py",
  "src/google_docs_mcp/formatting.py",
  "src/google_docs_mcp/tabs.py",
  "src/google_docs_mcp/tables.py",
  "src/google_docs_mcp/__init__.py",
  "src/google_docs_mcp/client.py",
  "src/google_docs_mcp/markdown.py",
  "src/google_docs_mcp/server.py",
]

[tool.hatch.build.targets.sdist]
only-include = [
  "src/google_docs_mcp/read_metadata.py",
  "src/google_docs_mcp/exports.py",
  "src/google_docs_mcp/images.py",
  "tests/test_read_metadata.py",
  "tests/test_exports.py",
  "tests/test_images.py",
  "tests/test_image_ranges.py",
  "tests/test_media_tools.py",
  "tests/test_live_exports.py",
  "tests/test_live_media.py",
  "src/google_docs_mcp/editing_common.py",
  "src/google_docs_mcp/sections.py",
  "src/google_docs_mcp/formatting.py",
  "src/google_docs_mcp/tabs.py",
  "src/google_docs_mcp/tables.py",
  "tests/test_editing_common.py",
  "tests/test_sections.py",
  "tests/test_formatting.py",
  "tests/test_tabs.py",
  "tests/test_tables.py",
  "tests/test_structured_tools.py",
  "tests/test_alignment.py",
  "tests/test_live_structured.py",
  "src/google_docs_mcp/__init__.py",
  "src/google_docs_mcp/client.py",
  "src/google_docs_mcp/markdown.py",
  "src/google_docs_mcp/server.py",
  "tests/test_client.py",
  "tests/test_entrypoint.py",
  "tests/test_insertion.py",
  "tests/test_live_google.py",
  "tests/test_live_harness.py",
  "tests/test_markdown.py",
  "tests/test_mcp_stdio.py",
  "tests/test_native_api.py",
  "tests/test_package.py",
  "tests/test_persian_api.py",
  "tests/test_publication.py",
  "tests/test_tools.py",
  "scripts/run-mcp",
  "docs/native-api-audit.md",
  "docs/structured-editing.md",
  "README.md",
  "LICENSE",
  "SECURITY.md",
  "pyproject.toml",
  "uv.lock",
  ".gitignore",
  ".python-version",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
